<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>✦ Alpaca 快樂製造所 ✦</title>
  <meta name="description" content="今天的 Happy Hour 怎麼過？讓羊駝幫你抽一個快樂提案 ♡">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #f8f3e9;
      color: #3f352d;
      overflow: hidden;
    }

    .app { width: 100%; height: 100dvh; display: flex; flex-direction: column; }

    /* 上方 90%：內容可捲動 */
    .content-area {
      height: 90dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 0 28px;
    }

    /* 下方 10%：固定警語 */
    .warning-area {
      height: 10dvh;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
      background: #eee4d4;
      border-top: 1px solid rgba(63, 53, 45, .12);
      font-size: clamp(12px, 3vw, 15px);
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: .03em;
      flex-shrink: 0;
    }

    .page { display: none; width: 100%; min-height: 100%; }
    .page.active { display: block; }

    .fade-in { animation: fadeIn .45s ease both; }
    .fade-out { animation: fadeOut .28s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

    .transition-page {
      min-height: 100%;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .transition-page.active { display: flex; }
    .thinking-text {
      font-size: clamp(25px, 7vw, 38px);
      font-weight: 800;
      letter-spacing: .04em;
    }
    .dots span { animation: dotPulse 1s infinite; opacity: .25; }
    .dots span:nth-child(2) { animation-delay: .16s; }
    .dots span:nth-child(3) { animation-delay: .32s; }
    @keyframes dotPulse { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

    .inner { width: min(100%, 760px); margin: 0 auto; }

    /* 1080 x 1080 主視覺比例 */
    .visual {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #e9dcc7;
      position: relative;
      overflow: hidden;
    }
    .visual img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .placeholder {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px; color: #8a7866; font-weight: 700; letter-spacing: .06em;
      background:
        radial-gradient(circle at 25% 25%, rgba(255,255,255,.55), transparent 30%),
        linear-gradient(145deg, #f4ead9, #e2d1b7);
    }

    .copy-area { padding: 30px 24px 8px; }
    .home-copy { text-align: center; }
    .home-title { font-size: clamp(26px, 7vw, 40px); font-weight: 800; margin: 0 0 12px; }
    .home-text { font-size: clamp(15px, 4vw, 19px); line-height: 1.8; margin: 0; color: #65584d; }

    .proposal-number {
      font-size: clamp(28px, 8vw, 46px);
      font-weight: 850;
      line-height: 1;
      margin: 0 0 22px;
      letter-spacing: -.02em;
    }
    .proposal-title {
      font-size: clamp(23px, 6vw, 34px);
      font-weight: 800;
      line-height: 1.45;
      margin: 0 0 18px;
    }
    .proposal-body {
      white-space: pre-line;
      font-size: clamp(15px, 4.1vw, 19px);
      font-weight: 400;
      line-height: 1.85;
      margin: 0;
      color: #5e5248;
    }

    .button-wrap { padding: 26px 24px 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    button {
      appearance: none; border: 0; cursor: pointer;
      min-width: min(88%, 360px);
      padding: 15px 24px;
      border-radius: 999px;
      background: #d9894b;
      color: #fff;
      font: inherit;
      font-size: clamp(16px, 4.3vw, 19px);
      font-weight: 800;
      letter-spacing: .03em;
      box-shadow: 0 8px 20px rgba(125, 78, 42, .16);
      transition: transform .15s ease, opacity .15s ease;
    }
    #vibeBtn {
      background: transparent;
      color: #d9894b;
      border: 2px solid #d9894b;
      box-shadow: none;
    }

    button:active { transform: scale(.98); opacity: .9; }

    @media (min-width: 761px) {
      .content-area { padding-top: 20px; }
      .inner { border-radius: 22px; overflow: hidden; background: rgba(255,255,255,.25); }
    }
  </style>

<style>
/* v8: transition copy centered on two lines */
#transitionPage, .transition-page, .loading-page, .transition-content, .loading-content {
  text-align: center;
}
</style>


<style>
/* v9 — proposal result layout */
#proposalPage .visual,
#proposalPage .hero,
#proposalPage .main-visual,
#proposalPage .image-wrap,
.proposal-page .visual,
.proposal-page .hero,
.proposal-page .main-visual,
.proposal-page .image-wrap,
.proposal-visual {
  width: 100%;
  aspect-ratio: 1080 / 800 !important;
  height: auto !important;
  overflow: hidden;
}

#proposalPage .visual img,
#proposalPage .hero img,
#proposalPage .main-visual img,
#proposalPage .image-wrap img,
.proposal-page .visual img,
.proposal-page .hero img,
.proposal-page .main-visual img,
.proposal-page .image-wrap img,
.proposal-visual img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#proposalPage .copy,
#proposalPage .text,
#proposalPage .content-text,
#proposalPage .proposal-copy,
#proposalPage .proposal-text,
.proposal-page .copy,
.proposal-page .text,
.proposal-page .content-text,
.proposal-page .proposal-copy,
.proposal-page .proposal-text,
.proposal-content,
.proposal-text {
  text-align: center !important;
}

#proposalPage .copy *,
#proposalPage .text *,
#proposalPage .content-text *,
#proposalPage .proposal-copy *,
#proposalPage .proposal-text *,
.proposal-page .copy *,
.proposal-page .text *,
.proposal-page .content-text *,
.proposal-page .proposal-copy *,
.proposal-page .proposal-text *,
.proposal-content *,
.proposal-text * {
  text-align: center !important;
}
</style>


<style>
/* v10 — force proposal copy to center */
#proposalPage,
.proposal-page {
  text-align: center;
}

#proposalPage .proposal-number,
#proposalPage .number,
#proposalPage .proposal-title,
#proposalPage .title,
#proposalPage .proposal-description,
#proposalPage .description,
#proposalPage .proposal-copy,
#proposalPage .proposal-text,
#proposalPage .text-area,
#proposalPage .copy-area,
.proposal-page .proposal-number,
.proposal-page .number,
.proposal-page .proposal-title,
.proposal-page .title,
.proposal-page .proposal-description,
.proposal-page .description,
.proposal-page .proposal-copy,
.proposal-page .proposal-text,
.proposal-page .text-area,
.proposal-page .copy-area {
  text-align: center !important;
  margin-left: auto;
  margin-right: auto;
}

/* Also center direct textual children inside the proposal content region */
#proposalPage h1,
#proposalPage h2,
#proposalPage h3,
#proposalPage p,
.proposal-page h1,
.proposal-page h2,
.proposal-page h3,
.proposal-page p {
  text-align: center !important;
}

/* Proposal visual is 1080×800 */
#proposalPage .visual,
#proposalPage .hero,
#proposalPage .main-visual,
#proposalPage .image-wrap,
.proposal-page .visual,
.proposal-page .hero,
.proposal-page .main-visual,
.proposal-page .image-wrap,
.proposal-visual {
  aspect-ratio: 1080 / 800 !important;
  height: auto !important;
}
</style>


<style>
/* v11 — deep green palette */
:root {
  --deep-green: #234C3D;
  --deep-green-dark: #19382E;
  --deep-green-soft: #DDE6DF;
  --page-cream: #F7F4EA;
  --footer-cream: #EAE4D5;
  --text-dark: #27352F;
}

/* Main page surfaces */
html, body,
.page,
#homePage,
#proposalPage,
.home-page,
.proposal-page {
  background-color: var(--page-cream) !important;
  color: var(--text-dark) !important;
}

/* Primary buttons */
button,
.btn,
.primary-btn,
#drawButton,
#redrawButton,
.draw-button,
.redraw-button {
  background-color: var(--deep-green) !important;
  border-color: var(--deep-green) !important;
  color: #fff !important;
}

/* Secondary atmosphere button: outline only */
#atmosphereButton,
.atmosphere-button,
.secondary-btn,
.outline-btn {
  background-color: transparent !important;
  border: 2px solid var(--deep-green) !important;
  color: var(--deep-green) !important;
}

/* Proposal text emphasis */
#proposalPage .proposal-number,
#proposalPage .number,
#proposalPage .proposal-title,
#proposalPage .title,
.proposal-page .proposal-number,
.proposal-page .number,
.proposal-page .proposal-title,
.proposal-page .title {
  color: var(--deep-green-dark) !important;
}

/* Transition page */
#transitionPage,
.transition-page,
.loading-page {
  background-color: var(--deep-green) !important;
  color: #fff !important;
}

/* Warning/footer area */
.warning,
.warning-area,
.footer-warning,
.alcohol-warning,
footer {
  background-color: var(--footer-cream) !important;
  color: var(--deep-green-dark) !important;
}

/* Placeholder visual tint */
.visual,
.hero,
.main-visual,
.image-wrap,
.proposal-visual {
  color: var(--deep-green-dark) !important;
}
</style>


<style>
/* v12 — light transition page + true outline atmosphere button */
#transitionPage,
.transition-page,
.loading-page {
  background: #F7F4EA !important;
  background-color: #F7F4EA !important;
  color: #19382E !important;
}

/* Explicitly override generic button fill */
#atmosphereButton,
.atmosphere-button,
button.atmosphere-button,
.secondary-btn,
.outline-btn {
  background: transparent !important;
  background-color: transparent !important;
  color: #234C3D !important;
  border: 2px solid #234C3D !important;
  box-shadow: none !important;
}

#atmosphereButton:hover,
.atmosphere-button:hover,
button.atmosphere-button:hover,
.secondary-btn:hover,
.outline-btn:hover {
  background: transparent !important;
  background-color: transparent !important;
  color: #19382E !important;
  border-color: #19382E !important;
}
</style>


<style>
/* v13 — target the actual atmosphere button ID */
#vibeBtn {
  background: transparent !important;
  background-color: transparent !important;
  color: #234C3D !important;
  border: 2px solid #234C3D !important;
  box-shadow: none !important;
}

#vibeBtn:hover,
#vibeBtn:focus {
  background: transparent !important;
  background-color: transparent !important;
  color: #19382E !important;
  border-color: #19382E !important;
}

#vibeBtn:active {
  background: transparent !important;
  background-color: transparent !important;
}
</style>


<style>
/* v14 — typewriter + loading dots */
#typingText, #loadingDots {
  color: #19382E;
  font: inherit;
}
#loadingDots {
  display: inline-block;
  min-width: 1.8em;
  text-align: left;
}
</style>





<style>
/* v16 — stable JS-controlled loading dots */
#loadingDots {
  display: inline-block;
  width: 1.5em;
  text-align: left;
  white-space: nowrap;
  vertical-align: baseline;
}
</style>


<style>
/* v17 — exactly one animated ellipsis, no static dots */
#loadingDots {
  display: inline-block !important;
  width: 1.45em !important;
  text-align: left !important;
  white-space: nowrap !important;
  overflow: visible !important;
  animation: none !important;
}
#loadingDots::before,
#loadingDots::after {
  content: none !important;
  display: none !important;
}
</style>


<style>
/* v20: SVG lightbulb above the loading copy */
.loading-stack { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; width:100%; }
.idea-bulb { width:clamp(88px, 24vw, 124px); height:auto; color:#234C3D; transform-origin:50% 55%; animation:bulbBreathe 1.1s ease-in-out infinite; overflow:visible; }
.bulb-rays { transform-origin:60px 60px; animation:raysGlow 1.1s ease-in-out infinite; }
@keyframes bulbBreathe { 0%,100% { transform:scale(1); } 50% { transform:scale(1.1); } }
@keyframes raysGlow { 0%,100% { opacity:.45; } 50% { opacity:1; } }
@media (prefers-reduced-motion: reduce) { .idea-bulb, .bulb-rays { animation:none; } }
</style>
</head>
<body>
  <main class="app">
    <section class="content-area" id="scrollArea">
      <!-- 首頁 -->
      <div class="page active" id="homePage">
        <div class="inner">
          <div class="visual">
            <!-- 將首頁 1080x1080 圖片檔名改成 home.jpg 即可直接顯示 -->
            <img src="home.jpg" alt="Happy Hour 首頁主視覺" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="placeholder" style="display:none;">HOME VISUAL<br>1080 × 1080</div>
          </div>
          <div class="copy-area home-copy">
            <h1 class="home-title">Happy Hour 提案</h1>
            <p class="home-text">不知道今天要怎麼過？<br>抽一個提案，讓 Happy Hour 幫你決定。</p>
          </div>
          <div class="button-wrap">
            <button type="button" id="drawBtn">抽一個Happy Hour提案</button>
          </div>
        </div>
      </div>

      <!-- 第一次抽取的短過場 -->
      <div class="page transition-page" id="transitionPage">
        <div class="loading-stack">
          <svg class="idea-bulb" viewBox="0 0 120 132" role="img" aria-label="靈感燈泡" xmlns="http://www.w3.org/2000/svg">
            <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M60 24c-20 0-35 15-35 35 0 15 8 23 17 33 3 3 5 8 5 12h26c0-4 2-9 5-12 9-10 17-18 17-33 0-20-15-35-35-35Z"/>
              <path d="M47 104h26M49 114h22M54 124h12"/>
              <path d="M52 89V74l-9-9m25 24V74l9-9M52 74h16" stroke-width="4"/>
            </g>
            <g class="bulb-rays" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
              <path d="M60 7V2M24 21l-8-8M96 21l8-8M12 56H3M108 56h9"/>
            </g>
          </svg>
          <div class="thinking-text">
            Happy Hour<br>
            靈感生成中<span id="loadingDots"></span>
          </div>
        </div>
      </div>

      <!-- 提案頁 -->
      <div class="page" id="proposalPage">
        <div class="inner">
          <div class="visual">
            <!-- 將提案頁 1080x1080 圖片檔名改成 proposal.jpg 即可直接顯示 -->
            <img src="proposal.jpg" alt="Happy Hour 提案主視覺" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="placeholder" style="display:none;">PROPOSAL VISUAL<br>1080 × 800</div>
          </div>
          <div class="copy-area">
            <p class="proposal-number" id="proposalNumber">#01</p>
            <h2 class="proposal-title" id="proposalTitle">今天先不要急著回家。</h2>
            <p class="proposal-body" id="proposalBody">找個舒服的地方坐一下，\n點點喜歡吃的，讓今天晚一點再結束。</p>
          </div>
          <div class="button-wrap">
            <button type="button" id="redrawBtn">再抽一個</button>
            <button type="button" id="vibeBtn">來點氛圍♪</button>
          </div>
        </div>
      </div>
    </section>

    <footer class="warning-area">
      飲酒過量，有害健康。禁止酒駕，未滿十八歲禁止飲酒。
    </footer>
  </main>

  <script>
    const proposals = [
      {
        number: '#01',
        title: '今天先不要急著回家。',
        body: '找個舒服的地方坐一下，\n點點喜歡吃的，讓今天晚一點再結束。'
      },
      {
        number: '#02',
        title: '今晚留一點時間給自己。',
        body: '挑一部看過很多次的電影，\n準備喜歡的零食，今天不用安排新鮮事。'
      }
    ];

    const homePage = document.getElementById('homePage');
    const proposalPage = document.getElementById('proposalPage');
    const transitionPage = document.getElementById('transitionPage');
    const scrollArea = document.getElementById('scrollArea');
    const numberEl = document.getElementById('proposalNumber');
    const titleEl = document.getElementById('proposalTitle');
    const bodyEl = document.getElementById('proposalBody');
    let currentIndex = -1;

    function randomIndex() {
      if (proposals.length <= 1) return 0;
      let next;
      do { next = Math.floor(Math.random() * proposals.length); }
      while (next === currentIndex);
      return next;
    }

    function setProposal() {
      currentIndex = randomIndex();
      const item = proposals[currentIndex];
      numberEl.textContent = item.number;
      titleEl.textContent = item.title;
      bodyEl.textContent = item.body;
    }

    function firstDraw() {
      homePage.classList.add('fade-out');
      setTimeout(() => {
        homePage.classList.remove('active', 'fade-out');
        transitionPage.classList.add('active', 'fade-in');
        scrollArea.scrollTop = 0;

        setTimeout(() => {
          transitionPage.classList.remove('fade-in');
          transitionPage.classList.add('fade-out');
          setTimeout(() => {
            transitionPage.classList.remove('active', 'fade-out');
            setProposal();
            proposalPage.classList.add('active', 'fade-in');
            scrollArea.scrollTop = 0;
            setTimeout(() => proposalPage.classList.remove('fade-in'), 500);
          }, 280);
        }, 2350);
      }, 280);
    }

    function redraw() {
      proposalPage.classList.add('fade-out');
      setTimeout(() => {
        setProposal();
        scrollArea.scrollTop = 0;
        proposalPage.classList.remove('fade-out');
        proposalPage.classList.add('fade-in');
        setTimeout(() => proposalPage.classList.remove('fade-in'), 500);
      }, 280);
    }

    document.getElementById('drawBtn').addEventListener('click', firstDraw);
    document.getElementById('redrawBtn').addEventListener('click', redraw);
    document.getElementById('vibeBtn').addEventListener('click', () => {
      window.open('https://www.youtube.com/@Alpaca-wine-tw', '_blank', 'noopener,noreferrer');
    });
  </script>













<script>
(function () {
  const dots = document.getElementById('loadingDots');
  if (!dots) return;

  let count = 1;
  dots.textContent = '.';

  setInterval(function () {
    count = count === 3 ? 1 : count + 1;
    dots.textContent = '.'.repeat(count);
  }, 350);
})();
</script>

</body>
</html>
